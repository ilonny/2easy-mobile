buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        // Avoid `node` lookups in library build.gradle when Android Studio has no PATH.
        REACT_NATIVE_NODE_MODULES_DIR = new File(rootDir, "../node_modules/react-native").canonicalFile.absolutePath
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

def resolveNodeBinary() {
    def fromEnv = System.getenv("NODE_BINARY")
    if (fromEnv != null && !fromEnv.isEmpty() && new File(fromEnv).exists()) {
        return fromEnv
    }
    def local = new File(rootDir, "node-bin/node")
    if (local.exists()) {
        return local.canonicalFile.absolutePath
    }
    for (candidate in ["/usr/local/bin/node", "/opt/homebrew/bin/node"]) {
        if (new File(candidate).exists()) {
            return candidate
        }
    }
    return "node"
}

def nodeBinaryPath = resolveNodeBinary()

subprojects { subproject ->
    // Point RN Gradle plugin at an absolute node binary whenever the react plugin is applied.
    subproject.pluginManager.withPlugin("com.facebook.react") {
        def reactExt = subproject.extensions.findByName("react")
        if (reactExt != null && reactExt.hasProperty("nodeExecutableAndArgs")) {
            reactExt.nodeExecutableAndArgs = [nodeBinaryPath]
        }
    }

    subproject.tasks.configureEach { task ->
        // reanimated/worklets hardcode commandLine("node", ...) for version asserts.
        // Android Studio's Gradle daemon often cannot resolve bare `node` on PATH.
        if (task.name == "assertMinimalReactNativeVersionTask" || task.name == "assertWorkletsVersionTask") {
            task.enabled = false
        }
    }
}
